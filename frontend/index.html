<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SynthSenses: AI Content Analysis</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Background video: plays silently, loops the first 20 seconds, never downloads controls -->
  <div class="video-bg">
    <video
      id="bg-video"
      src="video/tomvsbrad.mp4"
      autoplay
      muted
      loop
      playsinline
      preload="auto"
    ></video>
    <!-- Dark red overlay so text stays readable over any video content -->
    <div class="video-overlay"></div>
  </div>

  <!-- Main hero content centred on screen -->
  <main class="hero">

    <h1 class="hero-title">
      Detect &amp; <span class="accent">Predict.</span>
    </h1>

    <p class="hero-sub">
      Uncover synthetic media and forecast virality before you post!
    </p>

    <div class="hero-actions">
      <a href="pages/synthetic.html" class="btn btn-primary">Synthetic Detection</a>
      <a href="pages/virality.html"  class="btn btn-outline">Virality Prediction</a>
    </div>

    <!-- Three quick stat callouts -->
    <div class="stats">
      <div class="stat">
        <span class="stat-value">91%</span>
        <span class="stat-label">Detection Accuracy</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat">
        <span class="stat-value">20</span>
        <span class="stat-label">Virality Features</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat">
        <span class="stat-value">3</span>
        <span class="stat-label">Verdicts: Real / Deepfake / AI</span>
      </div>
    </div>

  </main>

  <script src="js/app.js"></script>
</body>
</html>
